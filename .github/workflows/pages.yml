name: Docs and install scripts to Pages

# The GitHub Pages site:
#
#   https://jsk-ros-pkg.github.io/solidworks_urdf_exporter2/              docs (English)
#   https://jsk-ros-pkg.github.io/solidworks_urdf_exporter2/ja/           docs (Japanese)
#   https://jsk-ros-pkg.github.io/solidworks_urdf_exporter2/install.sh    one-line installers
#   https://jsk-ros-pkg.github.io/solidworks_urdf_exporter2/install.ps1
#
# The docs are MkDocs (mkdocs.yml, docs/).  The installers live at the repo
# root (single source of truth) and are copied to the site root next to the
# docs, so their URLs -- printed in the README and in every release -- never
# change.
#
# Pull requests that touch the docs only BUILD the site (--strict, so a broken
# link or anchor fails the check); pushes to main build and deploy it.
#
# The Pages URL path is always <org>.github.io/<repo>/...; the repo name can't be
# dropped without a custom domain.  To go shorter (e.g. sw2robot.dev/install.sh),
# add a CNAME (see the commented step below) and point the domain's DNS at Pages.

on:
  push:
    branches: [main]
    paths:
      - install.sh
      - install.ps1
      - mkdocs.yml
      - docs/**
      - .github/workflows/pages.yml
  pull_request:
    paths:
      - mkdocs.yml
      - docs/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the docs
        env:
          # Material's end-of-life banner (see docs/requirements.txt)
          NO_MKDOCS_2_WARNING: '1'
        run: |
          pip install -r docs/requirements.txt
          mkdocs build --strict -d _site

      - name: Add the install scripts
        run: |
          cp install.sh install.ps1 _site/
          # disable Jekyll so the raw scripts are served verbatim (no templating,
          # and files/dirs starting with '_' or '.' aren't dropped)
          touch _site/.nojekyll

          # To serve from a custom domain instead, uncomment and set your domain,
          # then add the DNS records GitHub Pages documents:
          # echo "sw2robot.dev" > _site/CNAME

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # never run two Pages deploys at once; the newest push wins
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        # enablement: true turns Pages on for the repo on first run (source =
        # GitHub Actions), so no manual Settings -> Pages click is needed.
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - id: deployment
        uses: actions/deploy-pages@v4
