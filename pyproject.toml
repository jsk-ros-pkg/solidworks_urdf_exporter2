[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sw2robot"
version = "0.4.0"
description = "SolidWorks assembly -> URDF exporter with a browser-based editor"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Iori Yanokura", email = "ab.ioryz@gmail.com" }]
keywords = ["solidworks", "urdf", "robotics", "cad", "ros", "exporter"]
# NOTE: no "License :: OSI Approved :: ..." classifier on purpose -- PEP 639
# forbids pairing one with the SPDX `license = "Apache-2.0"` above, and both
# twine --strict and PyPI reject the upload if you do.
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = [
    "numpy>=2",
    # trimesh core + the backends its [easy] extra pulls, listed EXPLICITLY
    # instead of as `trimesh[easy]` so we can drop exactly ONE of them --
    # embreex -- on linux-aarch64, the only platform without an embreex wheel.
    # embreex is just an optional ray/mesh accelerator; trimesh runs without it,
    # so linux-arm64 loses nothing user-visible.  This mirrors trimesh 4.x's
    # [easy] set; keep it in sync when bumping trimesh (see release.yml arm job).
    "trimesh>=3.9",
    "colorlog",
    "manifold3d>=2.3.0",
    "charset-normalizer",
    "jsonschema",
    "networkx",
    "svg.path",
    "pycollada",
    "shapely",
    "xxhash",
    "rtree",
    "httpx",
    "scipy",
    "pillow",
    "vhacdx",
    "mapbox_earcut>=1.0.2",
    # everywhere EXCEPT linux-aarch64 (PEP 508 has no unary `not`, so this is the
    # De Morgan form of "not (linux and aarch64)")
    "embreex; sys_platform != 'linux' or platform_machine != 'aarch64'",
    "lxml",
    "pydantic>=2",
    "pyyaml>=6",
    # rotation/transform math (rpy<->matrix), FK, inertials, the per-mesh
    # primitive API behind the ROS-export --collision fitting, and the URDF
    # surgery the exporter and the editor run on: >=0.3.29 for
    # skrobot.urdf.merge_fixed_links.
    "scikit-robot>=0.3.29",
    # only the EXTRACT step (driving SolidWorks COM) needs this, and only on Windows
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
# the live self-collision highlight + the auto joint-limit sweep.  The FK side
# (scikit-robot) is now a core dependency; this extra only adds python-fcl for
# the collision queries.  The web editor's view / edit / extract / build all work
# WITHOUT it; collision + auto-limits degrade gracefully (clear error if a
# primitive collision mode is requested) when absent.
ui = [
    "python-fcl>=0.7",
]
# optional CoACD approximate convex decomposition for <collision> meshes in the
# ROS export (the `--collision coacd` CLI flag / the web "CoACD collision" box).
# A heavy compiled wheel, so it is its own opt-in extra; the export degrades to
# the plain visual-mesh collision (and a clear error if 'coacd' is requested
# without it) when this is not installed.
coacd = [
    "coacd",
]
# extra deps the test suite uses to validate exported ROS packages without a ROS
# install: catkin_pkg parses/validates package.xml the way catkin/colcon do
# (skrobot, used to load the exported URDF + resolve package:// meshes, is now a
# core dependency; python-fcl for the collision checks is in [ui]).
test = [
    "catkin_pkg",
    "pytest",
    "packaging",
]

[project.urls]
Homepage = "https://github.com/jsk-ros-pkg/solidworks_urdf_exporter2"
Repository = "https://github.com/jsk-ros-pkg/solidworks_urdf_exporter2"
Issues = "https://github.com/jsk-ros-pkg/solidworks_urdf_exporter2/issues"
Releases = "https://github.com/jsk-ros-pkg/solidworks_urdf_exporter2/releases"

[project.scripts]
sw2urdf = "sw2robot.exporter.export:main"     # extract + build (needs SolidWorks)
sw2robot = "sw2robot.editor.cli:main"        # headless build/edit/export CLI
sw2robot-web = "sw2robot.editor.webserver:main"  # the browser editor server

# hatchling's default sdist sweeps in every non-gitignored path in the repo --
# INCLUDING untracked scratch directories.  A local docs/ tree took the sdist
# from ~0.5 MB to 65 MB, so the file list is explicit here instead: an allowlist
# never grows behind our back.  assets/ (the 5 MB demo gif + the PyInstaller
# icons) is deliberately out; the README links it by absolute URL.
[tool.hatch.build.targets.sdist]
include = [
    "/sw2robot",
    "/tests",
    "/examples",
    "/README.md",
    "/CONTRIBUTING.md",
    "/LICENSE",
]

[tool.hatch.build.targets.wheel]
packages = ["sw2robot"]

[tool.hatch.build.targets.wheel.force-include]
"sw2robot/editor/web/index.html" = "sw2robot/editor/web/index.html"

[tool.pytest.ini_options]
# put the repo root on sys.path so `sw2robot` imports without an install
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "PIE", "RUF"]
ignore = [
    "E501", "E701", "E702", "E731", "E741",  # intentional compact one-liners
    "B023",     # closures run in the same loop iteration
    "B905",     # TODO: add zip(strict=)
    "RUF059",
]
